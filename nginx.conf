server {
    # Non-root container: unprivileged port
    listen 8080;
    server_name localhost;

    # Don't reveal the nginx version
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security headers (also re-included in every location that sets its own headers)
    include /etc/nginx/snippets/security-headers.conf;

    # SPA routing: fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change: cache for a year
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Build metadata must never be cached (used by the deploy smoke test)
    location = /version.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Favicon and other static images
    location ~* \.(ico|svg|png|jpg|jpeg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
