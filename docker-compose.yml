# BranchLab application.
# The reverse proxy (Caddy) lives in infra/caddy and reaches this container
# over the shared external "proxy" network, so no host ports are published.
#
# Production: CI builds the image and the server only pulls it.
#   IMAGE_TAG is written to .env by the deploy job (e.g. IMAGE_TAG=sha-1a2b3c4).
# Local:      docker network create proxy   (once)
#             docker compose up -d --build

services:
  branchlab:
    image: ghcr.io/petya122/branchlab:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: branchlab_app
    restart: unless-stopped
    labels:
      - com.getarcaneapp.arcane.updater=false
      - com.getarcaneapp.arcane.update-check=false
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true
