services:
  branchlab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: branchlab_app
    restart: unless-stopped
    ports:
      - "5000:80"
    expose:
      - "80"
    labels:
      - com.getarcaneapp.arcane.updater=false
      - com.getarcaneapp.arcane.update-check=false
    networks:
      - webnet

  caddy:
    image: caddy:2-alpine
    container_name: branchlab_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    labels:
      - com.getarcaneapp.arcane.updater=false
    networks:
      - webnet
      - nginx-proxy-network
    depends_on:
      - branchlab

networks:
  webnet:
    driver: bridge
  nginx-proxy-network:
    external: true

volumes:
  caddy_data:
  caddy_config:
