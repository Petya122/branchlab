# Arcane - Docker management UI, published only through Caddy
# (https://arcane.branchlab.tech, behind the tinyauth login). No host ports.
#   docker compose -f infra/arcane/compose.yml up -d
name: arcane

services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v3.1.1
    container_name: arcane
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
    # Arcane v3 only reads ARCANE_-prefixed settings and refuses to start while
    # the old names (APP_URL, ENCRYPTION_KEY) are set, so the values from .env
    # are mapped here instead of passing the file through with env_file.
    environment:
      - ARCANE_APP_URL=${APP_URL:-https://arcane.branchlab.tech}
      - ARCANE_ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in infra/arcane/.env}
    labels:
      - com.getarcaneapp.arcane.hidden=true
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true

volumes:
  arcane-data:
    name: arcane_arcane-data
