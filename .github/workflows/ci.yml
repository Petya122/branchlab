name: BranchLab CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Strict Typecheck
        run: npm run typecheck

      - name: 🧪 Run Automated Tests (Vitest)
        run: npm run test:run

      - name: 🚀 Build Production Bundle (Vite)
        run: npm run build

  deploy:
    name: 🚀 Deploy to Oracle Cloud
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.SSH_HOST != ''

    steps:
      - name: 🌐 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "${{ secrets.SSH_HOST }}"
          username: "${{ secrets.SSH_USER }}"
          key: "${{ secrets.SSH_PRIVATE_KEY }}"
          script: |
            cd ~/branchlab
            git pull origin main
            docker compose up -d --build
