version: 2

# Cooldown: Dependabot only proposes a release once it has been public for a
# few days. Compromised packages (e.g. the 2025 npm supply-chain attacks) are
# usually detected and unpublished within that window. Security updates for
# known vulnerabilities are NOT delayed by the cooldown.
# All updates are merged manually after CI passes (no auto-merge).

updates:
  # npm packages: minor + patch updates grouped into one weekly PR,
  # major updates arrive as separate PRs so they can be reviewed one by one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  # Versions / commit SHAs of the GitHub Actions used in the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)

  # Base images in the Dockerfile (node, nginx)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore(docker)
