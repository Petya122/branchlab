version: 2
updates:
  # npm packages: minor + patch updates grouped into one weekly PR,
  # major updates arrive as separate PRs so they can be reviewed one by one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  # Versions / commit SHAs of the GitHub Actions used in the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)

  # Base images in the Dockerfile (node, nginx)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(docker)
