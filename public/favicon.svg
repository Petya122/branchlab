<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="trunkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="branchGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />

  <!-- Background Accent Ambient Light -->
  <circle cx="90" cy="56" r="28" fill="#a855f7" opacity="0.12" filter="url(#glow)" />
  <circle cx="38" cy="94" r="24" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="38" cy="34" r="24" fill="#38bdf8" opacity="0.16" filter="url(#glow)" />

  <!-- Trunk Line -->
  <line x1="40" y1="94" x2="40" y2="34" stroke="url(#trunkGrad)" stroke-width="8" stroke-linecap="round" filter="url(#softGlow)" />

  <!-- Curved Feature Branch & Merge Path -->
  <path d="M 40 76 C 68 76, 88 68, 88 54 C 88 40, 68 34, 40 34" fill="none" stroke="url(#branchGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

  <!-- Commit Node 1: Trunk Root (Emerald Green) -->
  <circle cx="40" cy="94" r="13" fill="#090d16" stroke="#10b981" stroke-width="6" filter="url(#glow)" />
  <circle cx="40" cy="94" r="4.5" fill="#34d399" />

  <!-- Commit Node 2: Trunk Intermediate -->
  <circle cx="40" cy="64" r="8" fill="#090d16" stroke="#06b6d4" stroke-width="4.5" />
  <circle cx="40" cy="64" r="2.5" fill="#38bdf8" />

  <!-- Commit Node 3: Feature Branch Peak (Electric Violet) -->
  <circle cx="88" cy="54" r="13" fill="#090d16" stroke="#a855f7" stroke-width="6" filter="url(#glow)" />
  <circle cx="88" cy="54" r="4.5" fill="#c084fc" />

  <!-- Commit Node 4: Merge Head (Electric Cyan / Blue) -->
  <circle cx="40" cy="34" r="14" fill="#090d16" stroke="#38bdf8" stroke-width="6.5" filter="url(#glow)" />
  <circle cx="40" cy="34" r="5" fill="#ffffff" />
</svg>