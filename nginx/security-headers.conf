# Shared security headers.
# nginx drops ALL server-level add_header directives inside any location block
# that has its own add_header, so this file is included in every such block.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# Never send the page URL to other sites (e.g. when following the GitHub link)
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Deny everything by default, then allow only what the app needs, from this
# site only. No 'unsafe-inline': React applies style={{...}} through the CSSOM,
# which CSP doesn't restrict, and the build contains no inline <style>/<script>.
# data: is only allowed for small images/fonts that Vite may inline.
# vite.config.ts reads this line so `vite preview` (local e2e) enforces it too.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
